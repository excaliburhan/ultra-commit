<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项清单</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h1>我的待办事项</h1>
    <div class="todo-input">
      <input type="text" id="taskInput" placeholder="添加新的待办事项...">
      <button id="addTask">添加</button>
    </div>
    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="active">未完成</button>
      <button class="filter" data-filter="completed">已完成</button>
    </div>
    <ul id="taskList" class="task-list">
      <!-- 任务将通过JavaScript动态添加 -->
    </ul>
    <div class="todo-footer">
      <span id="taskCount">0 个待办事项</span>
      <button id="clearCompleted">清除已完成</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
